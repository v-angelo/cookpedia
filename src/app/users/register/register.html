<section
  class="min-vh-100 d-flex align-items-center justify-content-center"
  style="
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.5)), url('/foodBg01.jpg');
    background-size: cover;
    background-position: center;
  "
>
  <div class="container position-relative py-5">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">
        <!-- heading -->
        <div class="text-center mb-4">
          <h1 class="fw-bold mb-2">Register</h1>

          <p class="text-dark mb-0">Create your Cookpedia account</p>
        </div>

        <!-- register card -->
        <form class="bg-white border rounded-4 shadow p-4 p-md-5">
          <!-- logo -->
          <div class="text-center text-success mb-4">
            <a routerLink="/" class="text-success text-decoration-none">
              <h3 class="fw-bold mb-0">
                <i class="fa-solid fa-utensils me-2"></i>
                Cookpedia
              </h3>
            </a>
          </div>

          <!-- username -->
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold"> Username </label>

            <input
              type="text"
              id="username"
              class="form-control"
              placeholder="Enter your username"
            />
          </div>

          <!-- email -->
          <div class="mb-3">
            <label for="registerEmail" class="form-label fw-semibold"> Email </label>

            <input
              type="email"
              id="registerEmail"
              class="form-control"
              placeholder="Enter your email"
            />
          </div>

          <!-- password -->
          <div class="mb-3">
            <label for="registerPassword" class="form-label fw-semibold"> Password </label>

            <input
              type="password"
              id="registerPassword"
              class="form-control"
              placeholder="Create a password"
            />
          </div>

          <!-- confirm password -->
          <div class="mb-4">
            <label for="confirmPassword" class="form-label fw-semibold"> Confirm Password </label>

            <input
              type="password"
              id="confirmPassword"
              class="form-control"
              placeholder="Confirm your password"
            />
          </div>

          <!-- register -->
          <div class="d-grid mb-4">
            <button type="submit" class="btn btn-success fw-semibold py-2">Register</button>
          </div>

          <!-- login -->
          <div class="text-center">
            <p class="text-secondary mb-0">
              Already have an account?

              <a routerLink="/login" class="text-success fw-semibold text-decoration-none">
                Login
              </a>
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
