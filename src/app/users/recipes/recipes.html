<app-header></app-header>

<section class="container my-5">
  <div class="row">
    <section class="col-lg-2">
      <h4>Filter</h4>
      <button (click)="getAllRecipes()" class="btn mt-5">All</button>

      <div class="mt-3 dropdown">
        <button
          class="btn dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          Cuisine
        </button>
        <ul class="dropdown-menu">
          @for (cusine of cuisineArray(); track $index) {
            <button class="btn me-2">{{ cusine }}</button>
          }
        </ul>
      </div>

      <div class="mt-3 dropdown">
        <button
          class="btn dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          Meal Type
        </button>
        <ul class="dropdown-menu">
          @for (mealType of mealArray(); track $index) {
            <button class="btn me-2">{{ mealType }}</button>
          }
        </ul>
      </div>
    </section>

    <section class="col-lg-10">
      <div class="d-flex justify-content-between align-items-center">
        <h2>All Recipes</h2>
        <input type="text" class="form-control w-50" placeholder="Search Recipes Here... !" />
      </div>

      <div class="row my-3">
        @for (recipe of allRecipes(); track $index) {
          <div class="col-lg-3">
            <div class="p-3">
              <img [src]="recipe.image" alt="" class="img-fluid" />
              <h5 class="mt-2">{{ recipe.name }}</h5>
              <p>Cuisine: {{ recipe.cuisine }}</p>
            </div>
          </div>
        }
      </div>

      @if (allRecipes().length == 0) {
        <p class="text-danger my-2">Recipes Not Found</p>
      }
    </section>
  </div>
</section>

<app-footer></app-footer>
